appId: com.local.tieba-cleaner
productName: 贴吧清理助手
directories:
  buildResources: build
  output: release
asar: true
compression: maximum
electronLanguages:
  - zh-CN
  - en-US
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
msiProjectCreated: scripts/patch-msi-project.mjs
files:
  - out/**
  - resources/**
  - package.json
  - '!node_modules/**'
asarUnpack:
  - resources/**
win:
  executableName: TiebaCleaner
  icon: build/icon.ico
  target:
    - target: msi
      arch:
        - x64
msi:
  artifactName: 贴吧清理助手-${version}-win-x64.${ext}
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: 贴吧清理助手
  upgradeCode: 09495EC9-C590-45A7-8669-1DC5E1709553
  additionalLightArgs:
    - -cultures:zh-cn
npmRebuild: false
